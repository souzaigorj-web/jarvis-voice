<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Voice Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .header p {
            font-size: 0.9rem;
            color: #00d4ff;
            opacity: 0.8;
        }

        .display-area {
            width: 100%;
            background: rgba(10, 20, 50, 0.6);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 212, 255, 0.1);
            overflow-y: auto;
            max-height: 300px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: rgba(0, 153, 255, 0.2);
            border-left: 3px solid #0099ff;
            text-align: left;
            margin-left: 20px;
        }

        .jarvis-message {
            background: rgba(0, 212, 255, 0.15);
            border-left: 3px solid #00d4ff;
            text-align: left;
            margin-right: 20px;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 30px 20px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 15px;
            animation: slideIn 0.3s ease-out;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 212, 255, 0.3);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #00d4ff;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
        }

        .error {
            color: #ff6b6b;
            padding: 12px 15px;
            background: rgba(255, 107, 107, 0.1);
            border-left: 3px solid #ff6b6b;
            border-radius: 5px;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease-out;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .mic-button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00d4ff;
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.3), rgba(0, 212, 255, 0.2));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            position: relative;
        }

        .mic-button:hover:not(.listening):not(.processing) {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .mic-button.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.4), rgba(0, 153, 255, 0.3));
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
        }

        .mic-button.processing {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.4), rgba(0, 100, 200, 0.3));
            box-shadow: 0 0 40px rgba(0, 153, 255, 0.6);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.4), 0 0 40px rgba(0, 212, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.6), 0 0 80px rgba(0, 212, 255, 0.3);
            }
            100% {
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.4), 0 0 40px rgba(0, 212, 255, 0.2);
            }
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .button-label {
            font-size: 0.85rem;
            color: #00d4ff;
            text-align: center;
            min-height: 20px;
        }

        .send-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 8px;
            color: #0a0e27;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            display: none;
        }

        .send-button.visible {
            display: block;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .status-line {
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #00d4ff;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .debug-log {
            width: 100%;
            background: rgba(0, 50, 100, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.75rem;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.3;
        }

        .debug-log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .debug-log-entry:last-child {
            border-bottom: none;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }

            .mic-button {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }

            .display-area {
                min-height: 180px;
                max-height: 250px;
                padding: 15px;
            }

            .user-message, .jarvis-message {
                margin-left: 10px;
                margin-right: 10px;
            }

            .loading-container {
                padding: 20px 15px;
            }

            .spinner {
                width: 35px;
                height: 35px;
                border: 3px solid rgba(0, 212, 255, 0.3);
                border-top: 3px solid #00d4ff;
            }

            .loading-text {
                font-size: 1rem;
            }

            .debug-log {
                font-size: 0.65rem;
                max-height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JARVIS</h1>
            <p>Your Personal AI Assistant</p>
        </div>

        <div class="display-area" id="displayArea">
            <div class="message jarvis-message">Ready to listen...</div>
        </div>

        <div class="controls-section">
            <div class="mic-button-container">
                <button class="mic-button" id="micButton" title="Tap to speak">
                    🎤
                </button>
                <div class="button-label" id="buttonLabel">Tap to speak</div>
            </div>

            <button class="send-button" id="sendButton" title="Send message">
                Enviar
            </button>
        </div>

        <div class="status-line" id="statusLine">
            Aguardando...
        </div>

        <div class="debug-log" id="debugLog">
            <div class="debug-log-entry">Debug log initialized</div>
        </div>
    </div>

    <script>
        // Configuration
        const GEMINI_API_KEY = 'AIzaSyCyxFqPR0SICAG8k9KKAjOnbJY5DAJ-9b4';
        const GEMINI_MODEL = 'gemini-2.5-flash';
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
        const ELEVENLABS_API_KEY = 'sk_4c644f17c237701fccff3c0ad7faa743b7262b977cec4848';
        const ELEVENLABS_VOICE_ID = 'EXAVITQu4vr4xnSDxMaL';
        const ELEVENLABS_API_URL = `https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`;
        const SYSTEM_PROMPT = "Você é Jarvis, assistente pessoal inteligente e direto do usuário. Responda sempre no idioma que o usuário falar. Seja conciso mas completo.";

        // DOM Elements
        const micButton = document.getElementById('micButton');
        const displayArea = document.getElementById('displayArea');
        const statusLine = document.getElementById('statusLine');
        const buttonLabel = document.getElementById('buttonLabel');
        const sendButton = document.getElementById('sendButton');
        const debugLog = document.getElementById('debugLog');

        // State variables
        let isListening = false;
        let isProcessing = false;
        let isPlaying = false;
        let currentTranscript = '';
        let debugLogs = [];
        let audioUnlocked = false;
        
        // Global audio player for iOS Safari audio unlock
        const audioPlayer = new Audio();

        // Debug logging function
        function addDebugLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;
            debugLogs.push(entry);
            if (debugLogs.length > 5) {
                debugLogs.shift();
            }
            updateDebugDisplay();
            console.log(entry);
        }

        function updateDebugDisplay() {
            debugLog.innerHTML = debugLogs.map(log => `<div class="debug-log-entry">${log}</div>`).join('');
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'pt-BR';

        // Initialize
        micButton.addEventListener('click', (e) => {
            // Unlock audio on first tap for iOS Safari
            if (!audioUnlocked) {
                audioPlayer.play().catch(() => {
                    addDebugLog('Audio unlock attempt (expected to fail on first tap)');
                });
                audioUnlocked = true;
                addDebugLog('Audio context unlocked');
            }
            toggleListening();
        });
        sendButton.addEventListener('click', sendTranscript);
        recognition.addEventListener('start', onRecognitionStart);
        recognition.addEventListener('result', onRecognitionResult);
        recognition.addEventListener('end', onRecognitionEnd);
        recognition.addEventListener('error', onRecognitionError);

        function updateStatus(status) {
            statusLine.textContent = status;
            addDebugLog(`Status: ${status}`);
        }

        function toggleListening() {
            if (isListening) {
                recognition.stop();
            } else if (!isProcessing && !isPlaying) {
                currentTranscript = '';
                sendButton.classList.remove('visible');
                recognition.start();
            }
        }

        function onRecognitionStart() {
            isListening = true;
            currentTranscript = '';
            micButton.classList.add('listening');
            buttonLabel.textContent = 'Listening...';
            updateStatus('Ouvindo...');
            addDebugLog('Speech recognition started');
        }

        function onRecognitionResult(event) {
            let interimTranscript = '';
            
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                
                if (event.results[i].isFinal) {
                    currentTranscript += transcript;
                    addDebugLog(`Final transcript: "${transcript}"`);
                } else {
                    interimTranscript += transcript;
                }
            }

            if (interimTranscript) {
                buttonLabel.textContent = `Heard: "${interimTranscript}"`;
            }
        }

        function onRecognitionEnd() {
            isListening = false;
            micButton.classList.remove('listening');
            addDebugLog(`Recognition ended. Transcript: "${currentTranscript}"`);

            if (currentTranscript.trim()) {
                sendButton.classList.add('visible');
                buttonLabel.textContent = 'Tap "Enviar" or speak again';
                updateStatus('Pronto para enviar');
                
                // Auto-send after a short delay
                setTimeout(() => {
                    if (currentTranscript.trim() && !isProcessing) {
                        addDebugLog('Auto-sending transcript');
                        sendTranscript();
                    }
                }, 500);
            } else {
                buttonLabel.textContent = 'Tap to speak';
                updateStatus('Aguardando...');
            }
        }

        function onRecognitionError(event) {
            // Ignore 'aborted' errors - this is normal iOS behavior when recognition is stopped
            if (event.error === 'aborted') {
                addDebugLog(`Recognition aborted (normal)`);
                return;
            }
            addDebugLog(`Recognition error: ${event.error}`);
            updateStatus(`Error: ${event.error}`);
            displayArea.innerHTML += `<div class="error">Error: ${event.error}</div>`;
            isListening = false;
            micButton.classList.remove('listening');
            buttonLabel.textContent = 'Tap to speak';
        }

        function sendTranscript() {
            if (!currentTranscript.trim()) {
                updateStatus('No speech detected. Try again.');
                return;
            }

            if (isProcessing) {
                return;
            }

            sendButton.classList.remove('visible');
            handleUserInput(currentTranscript);
        }

        async function handleUserInput(transcript) {
            addMessage(transcript, 'user');
            
            isProcessing = true;
            micButton.classList.add('processing');
            buttonLabel.textContent = 'Processing...';
            updateStatus('Processando...');
            showLoadingIndicator();

            try {
                addDebugLog('Calling Gemini API...');
                const response = await getGeminiResponse(transcript);
                addDebugLog(`API response received: ${response.substring(0, 50)}...`);
                
                removeLoadingIndicator();
                addMessage(response, 'jarvis');
                
                // Get audio from ElevenLabs
                addDebugLog('Calling ElevenLabs TTS API...');
                await playAudioResponse(response);
                
                updateStatus('Aguardando...');
            } catch (error) {
                addDebugLog(`Error: ${error.message}`);
                removeLoadingIndicator();
                const errorMsg = `Error: ${error.message}`;
                addMessage(errorMsg, 'jarvis');
                updateStatus(`Erro: ${error.message}`);
            } finally {
                isProcessing = false;
                micButton.classList.remove('processing');
                buttonLabel.textContent = 'Tap to speak';
                currentTranscript = '';
            }
        }

        async function getGeminiResponse(userMessage) {
            const payload = {
                system_instruction: {
                    parts: [
                        {
                            text: SYSTEM_PROMPT
                        }
                    ]
                },
                contents: [
                    {
                        role: 'user',
                        parts: [
                            {
                                text: userMessage
                            }
                        ]
                    }
                ]
            };

            const response = await fetch(GEMINI_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                const errorMsg = data.error?.message || `API error: ${response.status}`;
                throw new Error(errorMsg);
            }

            const content = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!content) {
                throw new Error('No response text from API');
            }

            return content;
        }

        async function playAudioResponse(text) {
            try {
                addDebugLog('Requesting audio from ElevenLabs...');
                
                const payload = {
                    text: text,
                    model_id: 'eleven_multilingual_v2',
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.75
                    }
                };

                const response = await fetch(ELEVENLABS_API_URL, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': ELEVENLABS_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    throw new Error(`ElevenLabs API error: ${response.status} - ${errorData}`);
                }

                addDebugLog('Audio received from ElevenLabs');

                // Convert response to blob
                const audioBlob = await response.blob();
                addDebugLog(`Audio blob size: ${audioBlob.size} bytes`);

                // Create blob URL
                const blobUrl = URL.createObjectURL(audioBlob);
                addDebugLog(`Blob URL created: ${blobUrl.substring(0, 50)}...`);

                // Use global audio player for iOS Safari compatibility
                audioPlayer.src = blobUrl;
                isPlaying = true;
                updateStatus('Respondendo...');
                addDebugLog('Starting audio playback with global player');

                // Set up event handlers
                audioPlayer.onended = () => {
                    addDebugLog('Audio playback ended');
                    isPlaying = false;
                    updateStatus('Aguardando...');
                    // Clean up blob URL
                    URL.revokeObjectURL(blobUrl);
                };

                audioPlayer.onerror = (error) => {
                    addDebugLog(`Audio playback error: ${error}`);
                    isPlaying = false;
                    updateStatus('Aguardando...');
                    URL.revokeObjectURL(blobUrl);
                };

                // Play the audio
                const playPromise = audioPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        addDebugLog(`Play error: ${error.message}`);
                        isPlaying = false;
                        updateStatus('Aguardando...');
                    });
                }
            } catch (error) {
                addDebugLog(`Error in playAudioResponse: ${error.message}`);
                isPlaying = false;
                throw error;
            }
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = text;
            displayArea.appendChild(messageDiv);
            displayArea.scrollTop = displayArea.scrollHeight;
        }

        function showLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading-container';
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.innerHTML = '<div class="spinner"></div><div class="loading-text">Processando...</div>';
            displayArea.appendChild(loadingDiv);
            displayArea.scrollTop = displayArea.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
        }

        // Auto-detect language
        recognition.addEventListener('result', (event) => {
            if (event.isFinal && event.results.length > 0) {
                const transcript = event.results[event.results.length - 1][0].transcript;
                if (transcript.match(/[áàâãäéèêëíìîïóòôõöúùûüç]/i)) {
                    recognition.lang = 'pt-BR';
                } else if (transcript.match(/[áàâãäéèêëíìîïóòôõöúùûüñ]/i)) {
                    recognition.lang = 'es-ES';
                } else {
                    recognition.lang = 'en-US';
                }
            }
        }, { once: true });

        addDebugLog('Jarvis initialized with ElevenLabs TTS');
    </script>
</body>
</html>
