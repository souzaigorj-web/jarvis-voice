<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Voice Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .header-center {
            flex: 1;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 5px 0;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 0.85rem;
            color: #00d4ff;
            opacity: 0.8;
            margin: 0;
        }

        .settings-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #00d4ff;
            cursor: pointer;
            padding: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
            border-radius: 8px;
        }

        .settings-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .settings-modal.open {
            display: flex;
        }

        .settings-content {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .settings-content h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.3rem;
            text-align: center;
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group label {
            display: block;
            color: #00d4ff;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .settings-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 50, 100, 0.5);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
        }

        .key-status {
            font-size: 0.75rem;
            color: #00ff00;
            margin-top: 5px;
        }

        .key-status.custom {
            color: #00ff00;
        }

        .key-status.default {
            color: #ffaa00;
        }

        .settings-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .settings-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #0a0e27;
        }

        .btn-save:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .btn-close {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid #00d4ff;
        }

        .btn-close:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .display-area {
            width: 100%;
            background: rgba(10, 20, 50, 0.6);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            padding: 20px;
            min-height: 180px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-user {
            background: rgba(0, 153, 255, 0.2);
            border-left: 3px solid #0099ff;
            margin-left: 20px;
        }

        .msg-jarvis {
            background: rgba(0, 212, 255, 0.15);
            border-left: 3px solid #00d4ff;
            margin-right: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .mic-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00d4ff;
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.3), rgba(0, 212, 255, 0.2));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .mic-btn:hover:not(.listening):not(.processing) {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .mic-btn.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.4), rgba(0, 153, 255, 0.3));
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
        }

        .mic-btn.processing {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.4), rgba(0, 100, 200, 0.3));
            box-shadow: 0 0 40px rgba(0, 153, 255, 0.6);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.4), 0 0 40px rgba(0, 212, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.6), 0 0 80px rgba(0, 212, 255, 0.3);
            }
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .mic-label {
            font-size: 0.85rem;
            color: #00d4ff;
            text-align: center;
            min-height: 20px;
            max-width: 150px;
        }

        .status-bar {
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #00d4ff;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            font-weight: 600;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .debug-log {
            width: 100%;
            background: rgba(0, 50, 100, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.7rem;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.3;
        }

        .debug-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .debug-entry:last-child {
            border-bottom: none;
        }

        .reset-btn {
            padding: 8px 16px;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }

        .permission-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            text-align: center;
            min-height: 100vh;
        }

        .permission-screen.hidden {
            display: none;
        }

        .permission-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 400px;
        }

        .permission-content h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .permission-content p {
            font-size: 1rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .init-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 8px;
            color: #0a0e27;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .init-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .init-btn:active {
            transform: scale(0.95);
        }

        .main-ui {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .main-ui.hidden {
            display: none;
        }

        .error-message {
            padding: 15px;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }

            .mic-btn {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }

            .display-area {
                min-height: 150px;
                max-height: 250px;
                padding: 15px;
            }

            .debug-log {
                font-size: 0.65rem;
                max-height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="permission-screen" id="permissionScreen">
        <div class="permission-content">
            <h2>JARVIS</h2>
            <p>Seu assistente pessoal inteligente</p>
            <p style="font-size: 0.9rem; color: #00d4ff; opacity: 0.8;">Toque em Permitir Microfone para começar</p>
            <button class="init-btn" id="initBtn">Permitir Microfone</button>
            <div class="error-message hidden" id="errorMessage"></div>
        </div>
    </div>

    <div class="main-ui hidden" id="mainUI">
    <div class="container">
        <div class="header">
            <div class="header-center">
                <h1>JARVIS</h1>
                <p>Voice Assistant</p>
            </div>
            <button class="settings-btn" id="settingsBtn">⚙️</button>
        </div>

        <div class="settings-modal" id="settingsModal">
            <div class="settings-content">
                <h2>Settings</h2>
                <div class="settings-group">
                    <label for="geminiKeyInput">Gemini API Key</label>
                    <input type="password" id="geminiKeyInput" placeholder="Enter Gemini API key...">
                    <div class="key-status" id="geminiStatus"></div>
                </div>
                <div class="settings-group">
                    <label for="elevenlabsKeyInput">ElevenLabs API Key</label>
                    <input type="password" id="elevenlabsKeyInput" placeholder="Enter ElevenLabs API key...">
                    <div class="key-status" id="elevenlabsStatus"></div>
                </div>
                <div class="settings-buttons">
                    <button class="btn-save" id="saveBtn">Save</button>
                    <button class="btn-close" id="closeBtn">Close</button>
                </div>
            </div>
        </div>

        <div class="display-area" id="displayArea">
            <div class="message msg-jarvis">Ready to listen...</div>
        </div>

        <div class="controls">
            <div class="mic-container">
                <button class="mic-btn" id="micBtn">🎤</button>
                <div class="mic-label" id="micLabel">Tap to speak</div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 Reset</button>
        </div>

        <div class="status-bar" id="statusBar">Aguardando...</div>

        <div class="debug-log" id="debugLog">
            <div class="debug-entry">Initialized</div>
        </div>
    </div>
    </div>

    <script>
        // ============================================================================
        // CONFIGURATION
        // ============================================================================
        const CONFIG = {
            DEFAULT_GEMINI_KEY: 'AIzaSyBc-DB8lDZIXrWYQvciYh-Wh-5sPNpVUwc',
            DEFAULT_ELEVENLABS_KEY: 'sk_4c644f17c237701fccff3c0ad7faa743b7262b977cec4848',
            ELEVENLABS_VOICE_ID: 'EXAVITQu4vr4xnSDxMaL',
            SYSTEM_PROMPT: "Você é Jarvis, assistente pessoal inteligente e direto. Responda sempre no idioma que o usuário falar. Seja conciso e direto. Você ajuda com marketing, tecnologia, saúde, treinos, nutrição, automações e qualquer ideia.",
            SAFETY_TIMEOUT: 20000 // 20 seconds
        };

        // ============================================================================
        // STATE & STORAGE
        // ============================================================================
        let appState = 'idle'; // idle | listening | processing | speaking
        let apiKeys = {
            gemini: localStorage.getItem('gemini_key') || CONFIG.DEFAULT_GEMINI_KEY,
            elevenlabs: localStorage.getItem('elevenlabs_key') || CONFIG.DEFAULT_ELEVENLABS_KEY
        };
        let debugLogs = [];
        let safetyTimeout = null;

        // ============================================================================
        // DOM ELEMENTS
        // ============================================================================
        const els = {
            permissionScreen: document.getElementById('permissionScreen'),
            initBtn: document.getElementById('initBtn'),
            errorMessage: document.getElementById('errorMessage'),
            mainUI: document.getElementById('mainUI'),
            settingsBtn: document.getElementById('settingsBtn'),
            settingsModal: document.getElementById('settingsModal'),
            geminiKeyInput: document.getElementById('geminiKeyInput'),
            elevenlabsKeyInput: document.getElementById('elevenlabsKeyInput'),
            geminiStatus: document.getElementById('geminiStatus'),
            elevenlabsStatus: document.getElementById('elevenlabsStatus'),
            saveBtn: document.getElementById('saveBtn'),
            closeBtn: document.getElementById('closeBtn'),
            displayArea: document.getElementById('displayArea'),
            micBtn: document.getElementById('micBtn'),
            micLabel: document.getElementById('micLabel'),
            statusBar: document.getElementById('statusBar'),
            debugLog: document.getElementById('debugLog'),
            resetBtn: document.getElementById('resetBtn')
        };

        // ============================================================================
        // DEBUG LOGGING
        // ============================================================================
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            const entry = `[${time}] ${msg}`;
            debugLogs.push(entry);
            if (debugLogs.length > 5) debugLogs.shift();
            els.debugLog.innerHTML = debugLogs.map(l => `<div class="debug-entry">${l}</div>`).join('');
            els.debugLog.scrollTop = els.debugLog.scrollHeight;
            console.log(entry);
        }

        // ============================================================================
        // STATE MANAGEMENT
        // ============================================================================
        function setState(newState) {
            if (appState !== newState) {
                log(`State: ${appState} → ${newState}`);
                appState = newState;
                updateUI();
            }
        }

        function updateUI() {
            els.statusBar.textContent = {
                'idle': 'Aguardando...',
                'listening': 'Ouvindo...',
                'processing': 'Processando...',
                'speaking': 'Respondendo...'
            }[appState];

            els.micBtn.classList.toggle('listening', appState === 'listening');
            els.micBtn.classList.toggle('processing', appState === 'processing' || appState === 'speaking');
        }

        // ============================================================================
        // SETTINGS
        // ============================================================================
        function updateKeyStatuses() {
            const geminiCustom = localStorage.getItem('gemini_key');
            const elevenlabsCustom = localStorage.getItem('elevenlabs_key');
            
            els.geminiStatus.textContent = geminiCustom ? '✓ Custom' : '⚠ Default';
            els.geminiStatus.className = geminiCustom ? 'key-status custom' : 'key-status default';
            
            els.elevenlabsStatus.textContent = elevenlabsCustom ? '✓ Custom' : '⚠ Default';
            els.elevenlabsStatus.className = elevenlabsCustom ? 'key-status custom' : 'key-status default';
        }

        els.settingsBtn.addEventListener('click', () => {
            els.geminiKeyInput.value = localStorage.getItem('gemini_key') || '';
            els.elevenlabsKeyInput.value = localStorage.getItem('elevenlabs_key') || '';
            els.settingsModal.classList.add('open');
        });

        els.closeBtn.addEventListener('click', () => {
            els.settingsModal.classList.remove('open');
        });

        els.saveBtn.addEventListener('click', () => {
            const geminiKey = els.geminiKeyInput.value.trim();
            const elevenlabsKey = els.elevenlabsKeyInput.value.trim();
            
            if (geminiKey) {
                localStorage.setItem('gemini_key', geminiKey);
                apiKeys.gemini = geminiKey;
                log('Gemini key saved');
            }
            if (elevenlabsKey) {
                localStorage.setItem('elevenlabs_key', elevenlabsKey);
                apiKeys.elevenlabs = elevenlabsKey;
                log('ElevenLabs key saved');
            }
            updateKeyStatuses();
            els.settingsModal.classList.remove('open');
        });

        els.settingsModal.addEventListener('click', (e) => {
            if (e.target === els.settingsModal) {
                els.settingsModal.classList.remove('open');
            }
        });

        updateKeyStatuses();

        // ============================================================================
        // SAFETY TIMEOUT
        // ============================================================================
        function setSafetyTimeout() {
            clearSafetyTimeout();
            safetyTimeout = setTimeout(() => {
                if (appState !== 'idle') {
                    log('⚠️ Safety timeout triggered');
                    resetApp();
                }
            }, CONFIG.SAFETY_TIMEOUT);
        }

        function clearSafetyTimeout() {
            if (safetyTimeout) {
                clearTimeout(safetyTimeout);
                safetyTimeout = null;
            }
        }

        // ============================================================================
        // RESET
        // ============================================================================
        function resetApp() {
            log('=== RESET ===');
            setState('idle');
            clearSafetyTimeout();
            els.micLabel.textContent = 'Tap to speak';
        }

        els.resetBtn.addEventListener('click', resetApp);

        // ============================================================================
        // SPEECH RECOGNITION
        // ============================================================================
        function startListening() {
            if (appState !== 'idle') return;
            
            setState('listening');
            let transcript = '';

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                log('Speech recognition started');
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const t = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        transcript += t;
                    } else {
                        interim += t;
                    }
                }
                if (interim) {
                    els.micLabel.textContent = `"${interim}"`;
                }
            };

            recognition.onend = () => {
                log(`Speech ended. Transcript: "${transcript}"`);
                if (transcript.trim() && appState === 'listening') {
                    setState('processing');
                    setSafetyTimeout();
                    processUserInput(transcript);
                } else {
                    setState('idle');
                    els.micLabel.textContent = 'Tap to speak';
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'aborted' || event.error === 'no-speech') {
                    log(`Speech error (ignored): ${event.error}`);
                } else {
                    log(`Speech error: ${event.error}`);
                }
                if (appState === 'listening') {
                    setState('idle');
                    els.micLabel.textContent = 'Tap to speak';
                }
            };

            try {
                recognition.start();
            } catch (e) {
                log(`Error starting recognition: ${e.message}`);
                setState('idle');
            }
        }

        els.micBtn.addEventListener('click', () => {
            log(`Mic tapped. State: ${appState}`);
            if (appState === 'idle') {
                startListening();
            }
        });

        // ============================================================================
        // API CALLS
        // ============================================================================
        async function processUserInput(userText) {
            addMessage(userText, 'user');
            els.micLabel.textContent = 'Processing...';

            try {
                log('Calling Gemini API...');
                const response = await callGemini(userText);
                log(`Gemini response: ${response.substring(0, 50)}...`);
                
                addMessage(response, 'jarvis');
                
                log('Calling ElevenLabs TTS...');
                await playAudio(response);
                
                clearSafetyTimeout();
                setState('idle');
                els.micLabel.textContent = 'Tap to speak';
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                addMessage(`Error: ${error.message}`, 'jarvis');
                clearSafetyTimeout();
                setState('idle');
                els.micLabel.textContent = 'Tap to speak';
            }
        }

        async function callGemini(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKeys.gemini}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{ text: CONFIG.SYSTEM_PROMPT }]
                    },
                    contents: [{
                        role: 'user',
                        parts: [{ text: userText }]
                    }]
                })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error?.message || `API error: ${response.status}`);
            }

            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error('No response from Gemini');
            return text;
        }

        async function playAudio(text) {
            setState('speaking');
            
            const url = `https://api.elevenlabs.io/v1/text-to-speech/${CONFIG.ELEVENLABS_VOICE_ID}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'xi-api-key': apiKeys.elevenlabs,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: text,
                    model_id: 'eleven_multilingual_v2',
                    voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                })
            });

            if (!response.ok) {
                throw new Error(`ElevenLabs error: ${response.status}`);
            }

            // Convert to ArrayBuffer, then to base64 data URL
            const arrayBuffer = await response.arrayBuffer();
            const bytes = new Uint8Array(arrayBuffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const base64 = btoa(binary);
            const dataUrl = `data:audio/mpeg;base64,${base64}`;

            log(`Audio data URL created (${base64.length} chars)`);

            // Create new Audio element and play
            const audio = new Audio(dataUrl);
            audio.onended = () => {
                log('Audio playback ended');
                clearSafetyTimeout();
                setState('idle');
                els.micLabel.textContent = 'Tap to speak';
            };
            audio.onerror = () => {
                log('❌ Audio playback error');
                clearSafetyTimeout();
                setState('idle');
                els.micLabel.textContent = 'Tap to speak';
            };

            log('Playing audio...');
            await audio.play();
        }

        // ============================================================================
        // DISPLAY
        // ============================================================================
        function addMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type === 'user' ? 'msg-user' : 'msg-jarvis'}`;
            msg.textContent = text;
            els.displayArea.appendChild(msg);
            els.displayArea.scrollTop = els.displayArea.scrollHeight;
        }

        // ============================================================================
        // MICROPHONE PERMISSION
        // ============================================================================
        async function requestMicPermission() {
            try {
                log('Requesting microphone permission...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                log('Microphone permission granted');
                return true;
            } catch (err) {
                log('Microphone permission denied: ' + err.message);
                showError('Por favor, permita o acesso ao microfone nas configuracoes do Safari para usar o Jarvis.');
                return false;
            }
        }

        function showError(message) {
            els.errorMessage.textContent = message;
            els.errorMessage.classList.remove('hidden');
        }

        function hideError() {
            els.errorMessage.classList.add('hidden');
        }

        function showMainUI() {
            els.permissionScreen.classList.add('hidden');
            els.mainUI.classList.remove('hidden');
        }

        els.initBtn.addEventListener('click', async () => {
            els.initBtn.disabled = true;
            els.initBtn.textContent = 'Aguardando...';
            hideError();
            const granted = await requestMicPermission();
            if (granted) {
                showMainUI();
            } else {
                els.initBtn.disabled = false;
                els.initBtn.textContent = 'Permitir Microfone';
            }
        });

        // ============================================================================
        // INIT
        // ============================================================================
        log('Jarvis initialized');
        updateUI();
    </script>
</body>
</html>
